name: Extract uploaded ZIP archives

on:
  push:
    paths:
      - 'uploads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    name: Extract ZIP contents into repository root
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test extractor
        run: python -m unittest discover -s tests -v

      - name: Extract all uploaded ZIP files
        run: >-
          python tools/extract_zips.py
          --all
          --source uploads
          --dest .
          --strip-wrapper auto
          --on-conflict replace
          --delete-archives

      - name: Commit extracted files and remove processed archives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import contents of uploaded ZIP archives"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
