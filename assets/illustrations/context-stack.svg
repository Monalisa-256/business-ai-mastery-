<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Context has a hierarchy"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#4b5f55" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f6f1e8" stroke="#f6f1e8" stroke-width="0"/><rect width="1200" height="12" fill="#b76b45"/><text x="55" y="75" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="37" text-anchor="start" fill="#20352f">Context has a hierarchy</text><text x="57" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="19" text-anchor="start" fill="#4b5f55">Put evidence above stylistic preferences and unresolved questions</text><rect x="95" y="155" width="750" height="91" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="115" y="177" width="7" height="49" rx="4" fill="#dce9d9"/><text x="138" y="202" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">1  Approved facts</text><text x="138" y="238" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Price list, product record, signed policy</text><rect x="95" y="261" width="750" height="91" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="115" y="283" width="7" height="49" rx="4" fill="#efd6c7"/><text x="138" y="308" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">2  Working context</text><text x="138" y="344" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Brief, audience and intended platform</text><rect x="95" y="367" width="750" height="91" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="115" y="389" width="7" height="49" rx="4"