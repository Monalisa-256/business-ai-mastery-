nt-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" text-anchor="start" fill="#4b5f55">hypotheses</text><rect x="833" y="245" width="362" height="220" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="853" y="267" width="7" height="62" rx="4" fill="#efd6c7"/><text x="876" y="292" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">What next?</text><text x="876" y="328" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" text-anchor="start" fill="#4b5f55">A test, owner and review date</text><text x="600" y="560" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="25" text-anchor="middle" fill="#20352f">Do not treat a neat chart as an explanation.</text><text x="55" y="670" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="14" text-anchor="start" fill="#4b5f55">Business AI Mastery  |  Original instructional diagram</text></svg>