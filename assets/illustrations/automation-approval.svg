" text-anchor="start" fill="#4b5f55">fields</text><path d="M493,311 L510,311" fill="none" stroke="#4b5f55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="515" y="225" width="218" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="535" y="247" width="7" height="62" rx="4" fill="#b76b45"/><text x="558" y="272" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Draft</text><text x="558" y="308" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Prepare response</text><path d="M734,311 L751,311" fill="none" stroke="#4b5f55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="756" y="225" width="218" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="776" y="247" width="7" height="62" rx="4" fill="#dce9d9"/><text x="799" y="272" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Approve</text><text x="799" y="308" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Human reads and</text><text x="799" y="333" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">signs</text><path d="M975,311 L992,311" fill="none" stroke="#4b5f55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="997" y="225" width="218" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="1017" y="247" width="7" height="62" rx="4" fill="#b76b45"/><text x="1040" y="272" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Send</text><text x="1040" y="308" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Approved message</text><text x="1040