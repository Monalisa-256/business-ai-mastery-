<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="A five stage review loop"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#4b5f55" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f6f1e8" stroke="#f6f1e8" stroke-width="0"/><rect width="1200" height="12" fill="#b76b45"/><text x="55" y="75" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="37" text-anchor="start" fill="#20352f">A five stage review loop</text><text x="57" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="19" text-anchor="start" fill="#4b5f55">A human editor chooses what passes, not the generation tool</text><rect x="40" y="215" width="220" height="170" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="60" y="237" width="7" height="62" rx="4" fill="#b76b45"/><text x="83" y="262" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Collect</text><text x="83" y="298" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Find the approved</text><text x="83" y="323" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">facts</text><path d="M260,300 L276,300" fill="none" stroke="#4b5f55" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="279" y="215" width="220" height="170" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="299" y="237" width="7" height="62" rx="4" fill="#ddb773"/><text x="322" y="262" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Draft</text><text x="322" y="298" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Produce one version</text><path d="M499,300 L515,300" fill="none" stroke="#4b5f55" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="518" y="215" width="220" height="170" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="538" y="237" width="7" height="62" rx="4" fill="#ddb773"/><text x="561" y="262" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Inspect</text><text x="561" y="298" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Check against the</text><text x="561" y="323" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">brief</text><path d="M738,300 L754,300" fill="none" stroke="#4b5f55" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="757" y="215" width="220" height="170" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="777" y="237" width="7" height="62" rx="4" fill="#ddb773"/><text x="800" y="262" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Repair</text><text x="800" y="298" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Change the failing</text><text x="800" y="323" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">part</text><path d="M977,300 L993,300" fill="none" stroke="#4b5f55" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="996" y="215" width="220" height="170" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="1016" y="237" width="7" height="62" rx="4" fill="#b76b45"/><text x="1039" y="262" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Approve</text><text x="1039" y="298" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Human sign off</text><text x="600" y="515" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="26" text-anchor="middle" fill="#20352f">A new version is not automatically an improvement.</text><text x="600" y="548" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="19" text-anchor="middle" fill="#4b5f55">Keep a decision log and compare each revision to the same criteria.</text><text x="55" y="670" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="14" text-anchor="start" fill="#4b5f55">Business AI Mastery  |  Original instructional diagram</text></svg>