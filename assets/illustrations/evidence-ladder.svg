<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Evidence is not interchangeable"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#4b5f55" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f6f1e8" stroke="#f6f1e8" stroke-width="0"/><rect width="1200" height="12" fill="#b76b45"/><text x="55" y="75" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="37" text-anchor="start" fill="#20352f">Evidence is not interchangeable</text><text x="57" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="19" text-anchor="start" fill="#4b5f55">The claim decides what level of evidence is enough</text><rect x="90" y="150" width="1020" height="80" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="110" y="172" width="7" height="38" rx="4" fill="#dce9d9"/><text x="133" y="197" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Approved primary record</text><text x="133" y="233" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Use directly, with date and owner</text><rect x="90" y="245" width="1020" height="80" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="110" y="267" width="7" height="38" rx="4" fill="#dce9d9"/><text x="133" y="292" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Official documentation</text><text x="133" y="328" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Use for product capability, check access</text><rect x="90" y="340" width="1020" height="80" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="110" y="362" width="7" height="38" rx="4" fill="#efd6c7"/><text x="133" y="387" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Customer report</text><text x="133" y="423" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Verify identity and consent</text><rect x="90" y="435" width="1020" height="80" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="110" y="457" width="7" height="38" rx="4" fill="#e8c888"/><text x="133" y="482" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Search result or generated text</text><text x="133" y="518" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Investigate before repeating</text><rect x="90" y="530" width="1020" height="80" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="110" y="552" width="7" height="38" rx="4" fill="#f1b9ab"/><text x="133" y="577" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Unverified guess</text><text x="133" y="613" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="16" text-anchor="start" fill="#4b5f55">Do not publish as fact</text><text x="55" y="670" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="14" text-anchor="start" fill="#4b5f55">Business AI Mastery  |  Original instructional diagram</text></svg>