<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="A real customer journey"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#4b5f55" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f6f1e8" stroke="#f6f1e8" stroke-width="0"/><rect width="1200" height="12" fill="#b76b45"/><text x="55" y="75" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="37" text-anchor="start" fill="#20352f">A real customer journey</text><text x="57" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="19" text-anchor="start" fill="#4b5f55">A good CRM message knows what was actually recorded</text><rect x="32" y="220" width="220" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="52" y="242" width="7" height="62" rx="4" fill="#ddb773"/><text x="75" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Discovery</text><text x="75" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="17" text-anchor="start" fill="#4b5f55">Sees a product</text><path d="M252,308 L268,308" fill="none" stroke="#4b5f55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="272" y="220" width="220" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="292" y="242" width="7" height="62" rx="4" fill="#dce9d9"/><text x="315" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Question</text><text x="315" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="17" text-anchor="start" fill="#4b5f55">Asks about price</text><path d="M492,308 L508,308" fill="none" stroke="#4b5f55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="512" y="220" width="220" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="532" y="242" width="7" height="62" rx="4" fill="#efd6c7"/><text x="555" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Reply</text><text x="555" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="17" text-anchor="start" fill="#4b5f55">Gets a verified</text><text x="555" y="328" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="17" text-anchor="start" fill="#4b5f55">answer</text><path d="M732,308 L748,308" fill="none" stroke="#4b5f55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="752" y="220" width="220" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="772" y="242" width="7" height="62" rx="4" fill="#ddb773"/><text x="795" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Purchase</text><text x="795" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="17" text-anchor="start" fill="#4b5f55">Customer decides</text><path d="M972,308 L988,308" fill="none" stroke="#4b5f55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="992" y="220" width="220" height="175" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="1012" y="242" width="7" height="62" rx="4" fill="#dce9d9"/><text x="1035" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Aftercare</text><text x="1035" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="17" text-anchor="start" fill="#4b5f55">Support if needed</text><text x="600" y="541" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="21" text-anchor="middle" fill="#4b5f55">Do not invent a customer history to make a message sound personal.</text><text x="55" y="670" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="14" text-anchor="start" fill="#4b5f55">Business AI Mastery  |  Original instructional diagram</text></svg>