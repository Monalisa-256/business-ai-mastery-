<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Humanising written copy"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#4b5f55" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f6f1e8" stroke="#f6f1e8" stroke-width="0"/><rect width="1200" height="12" fill="#b76b45"/><text x="55" y="75" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="37" text-anchor="start" fill="#20352f">Humanising written copy</text><text x="57" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="19" text-anchor="start" fill="#4b5f55">Replace vague promises with a reason the reader cares</text><rect x="65" y="180" width="500" height="370" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="85" y="202" width="7" height="62" rx="4" fill="#b95c5a"/><text x="108" y="227" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22" text-anchor="start" fill="#20352f">Weak caption</text><text x="108" y="263" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" text-anchor="start" fill="#4b5f55">In today’s fast paced world,</text><text x="108" y="288" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" text-anchor="start" fill="#4b5f55">unlock the best experience</text><text x="108" y="313" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" text-anchor="start" fill="#4b5f55">with our revolutionary</text><text x="108" y="338" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" text-anchor="start" fill="#4b5f55">premium solutions.</text><rect x="635" y="180" width="500" height="370" rx="18" fill="#fffdf9" stroke="#d4d2c8" stroke-width="2"/><rect x="655" y="202" width="7" height="62" rx="4" fill="#5e8a6f"/><text x="678" y="227" font-